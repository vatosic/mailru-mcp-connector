name: Connector tests and mail domain verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/mailru-custom-domain-second-mailbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Inspect public domain MX (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          echo 'Current MX records for vbi.ru:'
          if command -v dig >/dev/null; then
            dig +short MX vbi.ru
          else
            getent hosts vbi.ru || true
          fi
